included: [Hrcek, HrcekShare, HrcekUITests, HrcekKit/Sources, HrcekKit/Tests]
excluded: [HrcekKit/.build, .build]

# swift-format owns layout; these rules would fight it.
disabled_rules: [trailing_comma, opening_brace, vertical_parameter_alignment]

opt_in_rules:
  - force_unwrapping
  - implicitly_unwrapped_optional
  - fatal_error_message
  - empty_count
  - first_where
  - contains_over_first_not_nil
  - private_swiftui_state
  - weak_delegate
  - closure_body_length

# Language codes and the like are clearer short.
identifier_name: {excluded: [id, ui, en, sl]}

line_length: {warning: 100, error: 120, ignores_urls: true}

# Complexity limits. --strict turns the warning levels into failures.
cyclomatic_complexity: {warning: 8, error: 12}
function_body_length: {warning: 40, error: 60}
closure_body_length: {warning: 30, error: 40}
type_body_length: {warning: 200, error: 300}
file_length: {warning: 300, error: 400}
nesting: {type_level: 2, function_level: 3}
function_parameter_count: {warning: 5, error: 7}
